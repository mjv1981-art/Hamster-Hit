:root {

<script>

      tone(165,54,.28,.46,'sine');
      tone(295,92,.22,.18,'triangle',.065);
      tone(125,63,.13,.16,'sine',.15);
      break;
    case 2:
      noise(.055,.27,3000);
      [785,1176,1820].forEach((note,i) => tone(note,note*.98,.35,.18,'sine',i*.009));
      break;
    case 3:
      tone(450,1650,.15,.18,'sine');
      tone(1300,240,.22,.18,'triangle',.145);
      noise(.09,.23,850,.2);
      break;
  }
}
function noise(duration, volume, frequency, offset = 0) {
  if (!sound || audio?.state !== 'running') return;
  const buffer = audio.createBuffer(1, Math.ceil(audio.sampleRate*duration), audio.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i=0;i<data.length;i++) data[i] = (Math.random()*2-1)*(1-i/data.length)**2;
  const source = audio.createBufferSource();
  const filter = audio.createBiquadFilter();
  const gain = audio.createGain();
  source.buffer = buffer;
  filter.type = 'lowpass';
  filter.frequency.value = frequency;
  gain.gain.value = volume;
  source.connect(filter).connect(gain).connect(output);
  source.start(audio.currentTime+offset);
}
function fragments(hole) {
  const sparks = ['✦','✧','★','✷'];
  const colors = ['#fff1a3','#fffbe7','#ffb3e5','#ffd853'];
  const pieces = [...Array.from({length:12}, (_, i) => sparks[i % sparks.length]),
    'tooth','tuft','tuft','tuft'];
  const direction = Math.random() * Math.PI * 2;
  hole.fx.replaceChildren(...pieces.map((piece,index) => {
    const particle = document.createElement('i');
    if (piece === 'tooth' || piece === 'tuft') particle.className = piece;
    else particle.textContent = piece;
    const angle = direction + index * Math.PI * 2 / pieces.length;
    const distance = 45 + Math.random() * 30;
    particle.style.setProperty('--x', Math.round(Math.cos(angle)*distance) + 'px');
    particle.style.setProperty('--y', Math.round(Math.sin(angle)*distance*.7 - 15) + 'px');
    particle.style.setProperty('--r', (index % 2 ? 1 : -1) * (100 + index * 23) + 'deg');
    particle.style.setProperty('--size', (11 + Math.round(Math.random()*10)) + 'px');
    particle.style.setProperty('--color', colors[index % colors.length]);
    return particle;
  }));
}
function music(now, left) {
  if (now < nextBeat) return;
  const rapid = raid || left <= 5000;
  const volume = now < duckUntil ? .84 : 1;
  const note = [262,330,392,330,294,349,440,349][beat % 8];
  tone(note,note,.13,.07*volume);
  if (beat % 2 === 0) tone(102,42,.12,.15*volume,'sine');
  if (rapid || streak >= 5) tone(note/2,note/2,.14,.08*volume);
  if (rapid) tone(790,230,.05,.045*volume,'square');
  beat++;
  nextBeat = now + (rapid ? 142 : 220);
}
function setHole(hole, state, until = 0, bonus = false) {
  Object.assign(hole, {state, until, bonus});
  hole.button.className = 'hole ' + state;
  hole.button.setAttribute('aria-disabled', state !== 'up');
  hole.gag.textContent = '';
  hole.fx.replaceChildren();
  if (state === 'up') {
    hole.sprite.style.backgroundImage = 'url("' + spritePaths[bonus ? 2 : choose([0,1,2])] + '")';
    hole.hat.textContent = choose(hats);
  }
}
function choose(array) { return array[Math.floor(Math.random()*array.length)]; }
function jolt() {
  if (!motion) return;
  gameScreen.classList.remove('shake');
  void gameScreen.offsetWidth;
  gameScreen.classList.add('shake');
}
function hud(now) {
  const values = {score, streak, clock:Math.max(0, Math.ceil((end-now)/1000))};
  for (const [id, value] of Object.entries(values)) {
    if (el(id).textContent !== String(value)) el(id).textContent = value;
  }
}
function hit(hole) {
  const now = performance.now();
  if (!active || now >= end) return;
  if (hole.state !== 'up' || now >= hole.until) {
    if (hole.state === 'empty') tone(100,65,.08,.08,'sine');
    return;
  }
  if (hole.bonus) { score += 2; raid.hits++; } else score++;
  setHole(hole,'hit',now+570);
  if (!bag.length) bag = gags.map((_,index) => index);
  lastGag = choose(bag.filter(index => index !== lastGag));
  bag.splice(bag.indexOf(lastGag),1);
  hole.button.dataset.gag = lastGag;
  hole.gag.textContent = gags[lastGag];
  hole.sprite.style.backgroundImage = 'url("' + knockoutSprites[knockoutFaces[lastGag]] + '")';
  fragments(hole);
  jolt();
  lastImpact = choose([0,1,2,3].filter(kind => kind !== lastImpact));
  impact(lastImpact);
  streak++;
  best = Math.max(best,streak);
  if (streak === 3 || streak === 5) announce(streak,now);
  if (streak >= 8 && !usedRaid && end-now >= 2400) {
    usedRaid = true;
    raid = {go:now+360,hits:0};
    const available = holes.filter(item => item !== hole).sort((a,b) => Number(a.state !== 'empty')-Number(b.state !== 'empty')).slice(0,3);
    for (let i=0;i<3;i++) {
      const target = choose(available);
      available.splice(available.indexOf(target),1);
      setHole(target,'ready',raid.go,true);
    }
    announce(8,now);
  }
  hud(now);
}
function tick(now) {
  if (now >= end) { finish(now); return; }
  for (const hole of holes) {
    if (now < hole.until) continue;
    if (hole.state === 'ready') setHole(hole,'up',now+1400,true);
    else if (hole.state !== 'empty') {
      if (hole.state === 'up') streak = 0;
      setHole(hole,'empty');
    }
  }
  if (raid && !holes.some(hole => hole.bonus)) {
    if (raid.hits === 3) {
      score += 5;
      banner('Stampede cleared! +5',now);
      [440,554,660,880].forEach((note,i) => tone(note,note,.2,.10,'triangle',i*.075));
      cheer(.39);
      playAnnouncer('crushed-it', now);
      jolt();
    }
    raid = null;
    nextSpawn = now + 250;
  }
  if (!raid && now >= nextSpawn) {
    const available = holes.filter(hole => hole.state === 'empty' && hole !== last);
    if (available.length) {
      const progress = (now-(end-30000))/30000;
      last = choose(available);
      setHole(last,'up',now+1620-840*progress);
      nextSpawn = now+1000-480*progress;
    }
  }
  const left = end-now;
  const prompt = left <= 5000 ? 'Final flurry!' : 'Tap the pop-ups!';
  if (now >= bannerUntil && el('call').textContent !== prompt) el('call').textContent = prompt;
  music(now,left);
  hud(now);
  requestAnimationFrame(tick);
}
function finish(now) {
  active = false;
  board.inert = true;
  holes.forEach(hole => setHole(hole,'empty'));
  stopVoice();
  stopCrowd();
  hud(now);
  el('headline').textContent = 'Round complete!';
  el('message').textContent = score + ' points · Best streak ' + best;
  el('call').textContent = 'Time!';
  el('play').textContent = 'Play again';
  el('panel').hidden = false;
  el('play').focus({preventScroll:true});
}
const screen = el('fullscreen');
const viewport = document.documentElement;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
function syncFullscreen() {
  const expanded = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
  screen.textContent = expanded ? 'Exit full screen' : 'Full screen';
  screen.setAttribute('aria-pressed',expanded);
}
document.addEventListener('fullscreenchange',syncFullscreen);
document.addEventListener('webkitfullscreenchange',syncFullscreen);
screen.hidden = Boolean(standalone);
screen.onclick = async () => {
  const help = el('screen-help');
  if (!help.hidden) { help.hidden = true; return; }
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      await (viewport.requestFullscreen || viewport.webkitRequestFullscreen).call(viewport);
    }
    syncFullscreen();
  } catch {
    help.textContent = /iPhone|iPad|iPod/.test(navigator.userAgent)
      ? 'For full screen, open in Safari and use Share → Add to Home Screen → Open as Web App.'
      : 'Open the game in your browser for full screen. You can also install it from the browser menu when available.';
    help.hidden = false;
  }
};
syncFullscreen();
const splash = el('splash-screen');
const loadingText = el('loading-text');
let tapeStarted = false;

function playTapeSound() {
  if (!sound || audio?.state !== 'running') return;
  const gain = audio.createGain();
  gain.gain.value = .1425;

  const duration = 3.6;
  const sampleRate = audio.sampleRate;
  const buffer = audio.createBuffer(1, sampleRate * duration, sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < buffer.length; i++) {
    const t = i / sampleRate;
    let sample = 0;

    if (t < 0.5) {
      sample = Math.random() * 0.28 - 0.14;
    } else if (t < 1.5) {
      sample = Math.sin(2 * Math.PI * 2000 * t) * 0.35 + (Math.random() * 0.1 - 0.05);
    } else if (t < 2.6) {
      const freq = (Math.sin(2 * Math.PI * 18 * t) > 0) ? 1500 : 2500;
      sample = Math.sin(2 * Math.PI * freq * t) * 0.36 + (Math.random() * 0.18 - 0.09);
    } else {
      const decay = 1 - (t - 2.6) / 1.0;
      sample = Math.sin(2 * Math.PI * 1600 * t) * 0.22 * decay;
    }

    sample += (Math.random() * 0.08 - 0.04) * (1 - t / duration);
    data[i] = Math.max(-1, Math.min(1, sample));
  }

  const source = audio.createBufferSource();
  source.buffer = buffer;
  source.connect(gain);
  gain.connect(audio.destination);
  source.start();

  source.onended = () => {
    source.disconnect();
    gain.disconnect();
  };
}

function startSplashSequence() {
  if (tapeStarted) return;
  tapeStarted = true;
  loadingText.textContent = '> TAPE LOADING... <';
  audioOn()?.then(() => { if (!splash.hidden) playTapeSound(); });
  let dots = 0;
  const interval = setInterval(() => {
    dots = (dots + 1) % 4;
    loadingText.textContent = '> TAPE LOADING' + '.'.repeat(dots) + ' <';
  },300);
  setTimeout(() => {
    clearInterval(interval);
    splash.hidden = true;
    gameScreen.inert = false;
    el('play').focus({preventScroll:true});
  },3600);
}
splash.addEventListener('click',startSplashSequence);
splash.addEventListener('keydown',event => {
  if (event.key === 'Enter' || event.key === ' ') {
    event.preventDefault();
    startSplashSequence();
  }
});
el('play').onclick = () => {
  if (active) return;
  const now = performance.now();
  active = true;
  audioOn();
  score = streak = best = beat = duckUntil = 0;
  last = raid = null;
  lastGag = lastImpact = -1;
  bag = [];
  usedRaid = false;
  end = now+30000;
  nextSpawn = now+300;
  nextBeat = now;
  el('screen-help').hidden = true;
  el('panel').hidden = true;
  board.inert = false;
  banner('Go!',now);
  hud(now);
  requestAnimationFrame(tick);
};
</script>

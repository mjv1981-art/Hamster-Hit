<html lang="en">

<meta name="theme-color" content="#19172c">
<title>Hamster Hit!</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#19172c;color:#fff6d9;font:800 16px system-ui;text-align:center}main{width:min(100%,460px);min-height:100svh;margin:auto;padding:16px;display:flex;flex-direction:column;justify-content:center;gap:10px;background:radial-gradient(ellipse at top,#61548e,#292540 75%)}h1{margin:0;font-size:clamp(42px,12vw,64px);letter-spacing:-.075em;color:#ffda59;text-shadow:0 4px #a7454a;transform:rotate(-3deg)}h1 span{color:#ff9671}p{margin:0}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid white;outline-offset:2px}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.hud div{background:#211e37;border:1px solid #8574a1;border-radius:12px;padding:5px;font-size:11px;letter-spacing:.08em}.hud b{display:block;font-size:25px;font-variant-numeric:tabular-nums}.arena{position:relative}.board{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;border:7px solid #b56d42;border-radius:22px;padding:8px;background:repeating-linear-gradient(-30deg,#fff0 0 13px,#fff2 13px 15px),#efaa61;box-shadow:0 5px #653e38}.hole{height:clamp(68px,15svh,112px);position:relative;overflow:hidden;border:0;border-radius:12px;background:#f9d08855;user-select:none;-webkit-tap-highlight-color:transparent}.rim{position:absolute;inset:auto 8% 6%;height:34%;background:#402637;border:5px solid #b36a47;border-radius:50%;box-shadow:inset 0 5px #2b1e31}.ready .rim{border-color:#fff476;box-shadow:0 0 15px #fff7b1}.ham{position:absolute;bottom:14%;left:50%;width:clamp(53px,20vw,82px);height:70%;transform:translate(-50%,120%);transition:transform .11s;pointer-events:none}.up .ham,.hit .ham{transform:translate(-50%)}.gag{position:absolute;inset:4% 1% auto;color:#fff8ca;text-shadow:0 2px #702d43,1px 0 #702d43,-1px 0 #702d43;pointer-events:none}.hit .ham{animation:whap .48s both}.hit .gag{animation:gag .55s both}
@keyframes whap{24%{transform:translate(-50%,4%) scale(1.16,.75) rotate(-12deg)}60%{transform:translate(-50%,-3%) rotate(9deg)}to{transform:translate(-50%,120%)}}@keyframes spin{55%{transform:translate(-50%,-5%) rotate(270deg)}to{transform:translate(-50%,120%) rotate(360deg)}}@keyframes gag{25%{transform:scale(1.14) rotate(-6deg)}to{opacity:0}}@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}.shake{animation:shake .22s}
.panel{position:absolute;inset:7px;border-radius:16px;display:grid;place-content:center;justify-items:center;gap:12px;background:#262138ed;padding:14px}.panel[hidden]{display:none}h2{margin:0;color:#ffdb59;font-size:clamp(25px,7vw,36px)}.play{background:#ffdb59;color:#382549;border:0;border-radius:12px;padding:11px 24px;box-shadow:0 5px #bc733c}.call{height:26px;color:#ffdb59;font-size:18px}.settings button{border:1px solid #8473a3;border-radius:8px;background:#28223d;color:#fff2dc;padding:6px 10px;font-size:12px}@media(prefers-reduced-motion:reduce){.shake,.hit .ham,.hit .gag{animation:none!important}.ham{transition:none}}

main{padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));min-height:100dvh}
html:fullscreen main{width:100%;max-width:820px}
html:-webkit-full-screen main{width:100%;max-width:820px}
#screen-help{color:#f1ddff;font-size:13px;line-height:1.35}
.hole{isolation:isolate}.ham{width:min(84%,120px);height:min(92%,110px);bottom:10%;z-index:1;transform:translate(-50%,130%)}
.sprite{position:absolute;inset:0;background:center/contain no-repeat url("assets/hamster-0.png?v=crop2");filter:drop-shadow(0 3px 1px #5b2c2b65)}
.hat{position:absolute;top:-4%;left:0;right:0;text-align:center;font-size:clamp(20px,5vh,38px);line-height:1;transform:rotate(-12deg);filter:drop-shadow(0 2px 0 #5d3045)}
.up .ham{animation:peek .25s both}.hit .ham{animation:whap .57s both}.hit[data-gag="3"] .ham{animation:spin .57s both}.hit[data-gag="2"] .ham{animation:pancake .57s both}.hit[data-gag="4"] .ham{animation:wobble .57s both}
.hit .hat{animation:fly .5s ease-out both;--x:44px;--y:-54px;--r:230deg}.hit[data-gag="0"] .hat,.hit[data-gag="2"] .hat,.hit[data-gag="4"] .hat{animation:none}
.gag{z-index:3;top:7%;color:#fffddb}.fx{position:absolute;inset:0;z-index:2;pointer-events:none}.fx i{position:absolute;left:50%;top:48%;font:normal 19px system-ui;color:#ffef67;text-shadow:0 2px #b4524a;animation:fly .54s ease-out both}.fx .tooth{font-size:17px;color:white}
@keyframes peek{0%{transform:translate(-50%,100%)}70%{transform:translate(-50%,-5%) scale(.96,1.05)}100%{transform:translate(-50%,0)}}
@keyframes pancake{20%{transform:translate(-50%,16%) scale(1.28,.55)}56%{transform:translate(-50%,-4%) scale(.93,1.08)}100%{transform:translate(-50%,125%)}}
@keyframes wobble{18%{transform:translate(-50%,0) rotate(-22deg)}38%{transform:translate(-50%,0) rotate(22deg)}58%{transform:translate(-50%,0) rotate(-14deg)}100%{transform:translate(-50%,125%) rotate(12deg)}}
@keyframes fly{0%{transform:translate(0,0) rotate(0) scale(.6)}24%{opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.8);opacity:0}}
@media (orientation:landscape) and (max-height:620px){
  main{width:100%;gap:6px;justify-content:center}
  main>p:first-of-type{display:none}
  h1{font-size:clamp(24px,8dvh,40px);transform:none}
  .hud{max-width:600px;width:100%;align-self:center}.hud div{padding:2px}.hud b{font-size:18px}
  .arena,.settings{width:min(100%,800px);align-self:center}.board{grid-template-columns:repeat(3,1fr);padding:4px;gap:4px;border-width:5px}
  .hole{height:clamp(44px,calc((100dvh - 199px - env(safe-area-inset-top) - env(safe-area-inset-bottom))/2),170px)}.call{font-size:15px;height:20px}.panel{gap:6px}
}
@media(prefers-reduced-motion:reduce){.up .ham,.fx i,.hit .hat{animation:none!important}.fx i{display:none}}
</style>
<main>
<h1>Hamster <span>Hit!</span></h1>
<p>The toy-box showdown</p>
<div class="hud"><div>SCORE<b id="score">0</b></div><div>TIME<b id="clock">30</b></div><div>STREAK<b id="streak">0</b></div></div>
<section class="arena" aria-label="Hamster arena">
<div class="board" id="board" inert></div>
<div class="panel" id="panel"><h2 id="headline">Ready to whap?</h2><p id="message">Tap the hamsters as they pop up.</p><button class="play" id="play">Play</button></div>
</section>
<p class="call" id="call" aria-live="polite">Six holes. Thirty seconds.</p>
<div class="settings"><button id="sound">Sound on</button> <button id="motion">Shake on</button> <button id="fullscreen">Full screen</button></div>
<p id="screen-help" role="status" hidden></p>
</main>
<script>
'use strict';
const el = id => document.getElementById(id);
const board = el('board');
const calls = {3:'TRIPLE WHAP!', 5:'MEGA SMASH!', 8:'HAMSTER STAMPEDE!'};
const hats = ['⛑️','👑','🎩','🤠','🎀','🧢'];
const spritePaths = Array.from({length:6}, (_, i) => 'assets/hamster-' + i + '.png?v=crop2');
spritePaths.forEach(path => { const image = new Image(); image.src = path; });
const announcerCues = new Map([
  [3, {name:'good-smash'}],
  [5, {name:'on-a-roll'}],
  [8, {name:'stampede'}],
  ['cleared', {name:'crushed-it'}]
]);
const voiceSources = new Set();
let voiceEnd = 0;
let voiceGeneration = 0;
const gags = ['HEY!', 'CLANG!', 'PANCAKE!', 'WHEEE!', 'OOOH!', 'HAT OFF!'];
const holes = Array.from({length:6}, (_, i) => {
  const button = document.createElement('button');
  button.setAttribute('aria-label', 'Hole ' + (i + 1));
  button.innerHTML = '<span class="rim"></span><span class="ham" aria-hidden="true"><span class="sprite"></span><span class="hat"></span></span><span class="fx" aria-hidden="true"></span><span class="gag" aria-hidden="true"></span>';
  const hole = {button, gag:button.querySelector('.gag'), hat:button.querySelector('.hat'),
    sprite:button.querySelector('.sprite'), fx:button.querySelector('.fx')};
  button.onclick = () => hit(hole);
  board.append(button);
  setHole(hole, 'empty');
  return hole;
});
let sound = true;
let motion = !matchMedia('(prefers-reduced-motion:reduce)').matches;
let audio, output, end, nextSpawn, nextBeat, beat, score, streak, best;
let active = false;
let last, lastGag, lastImpact, bag, raid, usedRaid, bannerUntil, duckUntil;
function settings() {
  for (const [id, name, enabled] of [['sound','Sound',sound],['motion','Shake',motion]]) {
    el(id).textContent = name + (enabled ? ' on' : ' off');
    el(id).setAttribute('aria-pressed', enabled);
  }
}
settings();
el('sound').onclick = () => {
  sound = !sound;
  if (sound) audioOn();
  if (output) output.gain.value = sound ? .55 : 0;
  if (!sound) stopVoice();
  settings();
};
el('motion').onclick = () => { motion = !motion; settings(); };
function audioOn() {
  if (!sound) return;
  const Context = window.AudioContext || window.webkitAudioContext;
  if (!Context) return;
  if (!audio) {
    audio = new Context();
    output = audio.createGain();
    output.gain.value = .55;
    output.connect(audio.destination);
  }
  audio.resume().catch(() => {});
  loadAnnouncer();
}
function loadAnnouncer() {
  for (const cue of announcerCues.values()) {
    if (cue.clip || cue.loading) continue;
    cue.loading = fetch('assets/announcer/' + cue.name + '.wav')
      .then(response => {
        if (!response.ok) throw new Error('Announcer clip unavailable');
        return response.arrayBuffer();
      })
      .then(bytes => audio.decodeAudioData(bytes))
      .then(clip => { cue.clip = clip; return clip; })
      .catch(() => null)
      .finally(() => { cue.loading = null; });
  }
}
function tone(from, to, duration, volume, shape = 'triangle', offset = 0) {
  if (!sound || audio?.state !== 'running') return;
  const time = audio.currentTime + offset;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = shape;
  osc.frequency.setValueAtTime(from, time);
  osc.frequency.exponentialRampToValueAtTime(to, time + duration);
  gain.gain.setValueAtTime(volume, time);
  gain.gain.exponentialRampToValueAtTime(.001, time + duration);
  osc.connect(gain).connect(output);
  osc.start(time);
  osc.stop(time + duration);
}
function banner(words, now) {
  el('call').textContent = words;
  bannerUntil = now + 1450;
}
function stopVoice() {
  voiceGeneration++;
  for (const source of voiceSources) source.stop();
  voiceSources.clear();
  voiceEnd = duckUntil = 0;
}
function playAnnouncer(key, now) {
  if (!sound) return;
  const cue = announcerCues.get(key);
  if (cue.clip) {
    playVoiceClip(cue.clip, now);
    return;
  }
  const generation = voiceGeneration;
  cue.loading?.then(clip => {
    const readyAt = performance.now();
    if (clip && generation === voiceGeneration && readyAt - now < 1000) {
      playVoiceClip(clip, readyAt);
    }
  });
}
function playVoiceClip(clip, now) {
  if (!active || !sound || audio?.state !== 'running') return;
  const start = Math.max(audio.currentTime + .075, voiceEnd + .06);
  const wait = start - audio.currentTime;
  if (wait > 3.2 || now + wait * 1000 >= end) return;
  const source = audio.createBufferSource();
  source.buffer = clip;
  source.connect(output);
  voiceSources.add(source);
  source.onended = () => {
    voiceSources.delete(source);
    source.disconnect();
  };
  source.start(start);
  voiceEnd = start + clip.duration;
  duckUntil = now + (wait + clip.duration + .15) * 1000;
}
function announce(milestone, now) {
  banner(calls[milestone], now);
  const fanfare = milestone === 3 ? [330,440,660] : milestone === 5 ? [220,330,440,659] : [196,262,392,523,784];
  fanfare.forEach((note, i) => tone(note,note,.20,.10,'triangle',i*.07));
  if (milestone >= 5) {
    noise(.5,.07,1100,.16);
    tone(540,940,.22,.05,'sine',.19);
    tone(840,650,.21,.04,'sine',.27);
  }
  playAnnouncer(milestone, now);
}
function impact(kind) {
  switch (kind) {
    case 0:
      noise(.12,.42,1600);
      tone(183,55,.15,.44);
      break;
    case 1:
      tone(165,54,.28,.46,'sine');
      tone(295,92,.22,.18,'triangle',.065);
      tone(125,63,.13,.16,'sine',.15);
      break;
    case 2:
      noise(.055,.27,3000);
      [785,1176,1820].forEach((note,i) => tone(note,note*.98,.35,.18,'sine',i*.009));
      break;
    case 3:
      tone(450,1650,.15,.18,'sine');
      tone(1300,240,.22,.18,'triangle',.145);
      noise(.09,.23,850,.2);
      break;
  }
}
function noise(duration, volume, frequency, offset = 0) {
  if (!sound || audio?.state !== 'running') return;
  const buffer = audio.createBuffer(1, Math.ceil(audio.sampleRate*duration), audio.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i=0;i<data.length;i++) data[i] = (Math.random()*2-1)*(1-i/data.length)**2;
  const source = audio.createBufferSource();
  const filter = audio.createBiquadFilter();
  const gain = audio.createGain();
  source.buffer = buffer;
  filter.type = 'lowpass';
  filter.frequency.value = frequency;
  gain.gain.value = volume;
  source.connect(filter).connect(gain).connect(output);
  source.start(audio.currentTime+offset);
}
function fragments(hole, gag) {
  const shapes = gag === 0 || gag === 2 ? ['🦷','✦','✧','✷','★','✧'] : ['✦','✧','★','✷','✧','✦'];
  hole.fx.replaceChildren(...shapes.map((shape,index) => {
    const particle = document.createElement('i');
    particle.textContent = shape;
    particle.className = shape === '🦷' ? 'tooth' : '';
    const angle = index * Math.PI / 3 + Math.random()*.3;
    particle.style.setProperty('--x', Math.round(Math.cos(angle)*65) + 'px');
    particle.style.setProperty('--y', Math.round(Math.sin(angle)*48-20) + 'px');
    particle.style.setProperty('--r', (index*65) + 'deg');
    return particle;
  }));
}
function music(now, left) {
  if (now < nextBeat) return;
  const rapid = raid || left <= 5000;
  const volume = now < duckUntil ? .23 : 1;
  const note = [262,330,392,330,294,349,440,349][beat % 8];
  tone(note,note,.13,.07*volume);
  if (beat % 2 === 0) tone(102,42,.12,.15*volume,'sine');
  if (rapid || streak >= 5) tone(note/2,note/2,.14,.08*volume);
  if (rapid) tone(790,230,.05,.045*volume,'square');
  beat++;
  nextBeat = now + (rapid ? 142 : 220);
}
function setHole(hole, state, until = 0, bonus = false) {
  Object.assign(hole, {state, until, bonus});
  hole.button.className = 'hole ' + state;
  hole.button.setAttribute('aria-disabled', state !== 'up');
  hole.gag.textContent = '';
  hole.fx.replaceChildren();
  if (state === 'up') {
    hole.sprite.style.backgroundImage = 'url("' + spritePaths[bonus ? 2 : choose([0,1,2])] + '")';
    hole.hat.textContent = choose(hats);
  }
}
function choose(array) { return array[Math.floor(Math.random()*array.length)]; }
function jolt() {
  if (!motion) return;
  board.classList.remove('shake');
  void board.offsetWidth;
  board.classList.add('shake');
}
function hud(now) {
  const values = {score, streak, clock:Math.max(0, Math.ceil((end-now)/1000))};
  for (const [id, value] of Object.entries(values)) {
    if (el(id).textContent !== String(value)) el(id).textContent = value;
  }
}
function hit(hole) {
  const now = performance.now();
  if (!active || now >= end) return;
  if (hole.state !== 'up' || now >= hole.until) {
    if (hole.state === 'empty') tone(100,65,.08,.08,'sine');
    return;
  }
  if (hole.bonus) { score += 2; raid.hits++; } else score++;
  setHole(hole,'hit',now+570);
  if (!bag.length) bag = gags.map((_,index) => index);
  lastGag = choose(bag.filter(index => index !== lastGag));
  bag.splice(bag.indexOf(lastGag),1);
  hole.button.dataset.gag = lastGag;
  hole.gag.textContent = gags[lastGag];
  hole.sprite.style.backgroundImage = 'url("' + spritePaths[[4,1,3,4,5,2][lastGag]] + '")';
  fragments(hole,lastGag);
  lastImpact = choose([0,1,2,3].filter(kind => kind !== lastImpact));
  impact(lastImpact);
  streak++;
  best = Math.max(best,streak);
  if (streak === 3 || streak === 5) announce(streak,now);
  if (streak === 5) jolt();
  if (streak >= 8 && !usedRaid && end-now >= 2400) {
    usedRaid = true;
    raid = {go:now+360,hits:0};
    const available = holes.filter(item => item !== hole).sort((a,b) => Number(a.state !== 'empty')-Number(b.state !== 'empty')).slice(0,3);
    for (let i=0;i<3;i++) {
      const target = choose(available);
      available.splice(available.indexOf(target),1);
      setHole(target,'ready',raid.go,true);
    }
    announce(8,now);
    jolt();
  }
  hud(now);
}
function tick(now) {
  if (now >= end) { finish(now); return; }
  for (const hole of holes) {
    if (now < hole.until) continue;
    if (hole.state === 'ready') setHole(hole,'up',now+1400,true);
    else if (hole.state !== 'empty') {
      if (hole.state === 'up') streak = 0;
      setHole(hole,'empty');
    }
  }
  if (raid && !holes.some(hole => hole.bonus)) {
    if (raid.hits === 3) {
      score += 5;
      banner('Stampede cleared! +5',now);
      [440,554,660,880].forEach((note,i) => tone(note,note,.2,.10,'triangle',i*.075));
      playAnnouncer('cleared', now);
      jolt();
    }
    raid = null;
    nextSpawn = now + 250;
  }
  if (!raid && now >= nextSpawn) {
    const available = holes.filter(hole => hole.state === 'empty' && hole !== last);
    if (available.length) {
      const progress = (now-(end-30000))/30000;
      last = choose(available);
      setHole(last,'up',now+1620-840*progress);
      nextSpawn = now+1000-480*progress;
    }
  }
  const left = end-now;
  const prompt = left <= 5000 ? 'Final flurry!' : 'Tap the pop-ups!';
  if (now >= bannerUntil && el('call').textContent !== prompt) el('call').textContent = prompt;
  music(now,left);
  hud(now);
  requestAnimationFrame(tick);
}
function finish(now) {
  active = false;
  board.inert = true;
  holes.forEach(hole => setHole(hole,'empty'));
  stopVoice();
  hud(now);
  el('headline').textContent = 'Round complete!';
  el('message').textContent = score + ' points · Best streak ' + best;
  el('call').textContent = 'Time!';
  el('play').textContent = 'Play again';
  el('panel').hidden = false;
  el('play').focus({preventScroll:true});
}
const screen = el('fullscreen');
const viewport = document.documentElement;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
function syncFullscreen() {
  const expanded = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
  screen.textContent = expanded ? 'Exit full screen' : 'Full screen';
  screen.setAttribute('aria-pressed',expanded);
}
document.addEventListener('fullscreenchange',syncFullscreen);
document.addEventListener('webkitfullscreenchange',syncFullscreen);
screen.hidden = Boolean(standalone);
screen.onclick = async () => {
  const help = el('screen-help');
  if (!help.hidden) { help.hidden = true; return; }
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      await (viewport.requestFullscreen || viewport.webkitRequestFullscreen).call(viewport);
    }
    syncFullscreen();
  } catch {
    help.textContent = /iPhone|iPad|iPod/.test(navigator.userAgent)
      ? 'For full screen, open in Safari and use Share → Add to Home Screen → Open as Web App.'
      : 'Open the game in your browser for full screen. You can also install it from the browser menu when available.';
    help.hidden = false;
  }
};
syncFullscreen();
el('play').onclick = () => {
  if (active) return;
  audioOn();
  const now = performance.now();
  active = true;
  score = streak = best = beat = duckUntil = 0;
  last = raid = null;
  lastGag = lastImpact = -1;
  bag = [];
  usedRaid = false;
  end = now+30000;
  nextSpawn = now+300;
  nextBeat = now;
  el('screen-help').hidden = true;
  el('panel').hidden = true;
  board.inert = false;
  banner('Go!',now);
  hud(now);
  requestAnimationFrame(tick);
};
</script>
</html>
